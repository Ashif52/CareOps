services:
  postgres:
    image: postgres:16-alpine
    container_name: careops-postgres
    restart: always
    environment:
      POSTGRES_USER: careops
      POSTGRES_PASSWORD: careopspassword123
      POSTGRES_DB: careops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careops -d careops"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careops-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://careops:careopspassword123@postgres:5432/careops
      - SECRET_KEY=careops_super_secret_jwt_key_2026
      - PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: careops-frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads_data:
