services:
  postgres:
    image: postgres:16-alpine
    container_name: careops-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-careops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-careops}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-careops} -d ${POSTGRES_DB:-careops}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careops-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-careops}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-careops}
      - SECRET_KEY=${SECRET_KEY}
      - ENVIRONMENT=production
      - DEBUG_MODE=false
      - PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: careops-frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads_data:
